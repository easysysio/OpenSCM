name: Tests

# Runs on every push and pull request — and is called by the release
# workflow so a tag cannot produce artifacts from a failing tree. Tests,
# clippy and cargo audit, the same three checks release.sh runs.
#
# This exists because it didn't: releases were built straight from a tag
# with no test run, and 0.7.4 shipped a template that failed to parse,
# crash-looping the server on boot until it was hotfixed. Every test in
# this suite is fast (the whole run is seconds) — there is no reason for
# it not to gate.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Fewer codegen units / no incremental: CI builds are one-shot.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: cargo test · workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # No toolchain action: rust-toolchain.toml pins the version, and
      # rustup on the runner honours it automatically. Using a setup
      # action here would silently override that pin.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build (workspace)
        run: cargo build --workspace --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

  clippy:
    name: cargo clippy · workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # rustup installs the toolchain pinned in rust-toolchain.toml on first
      # use, without clippy. Added here only, not in rust-toolchain.toml, so
      # the build jobs do not download it too.
      - name: Install clippy
        run: rustup component add clippy

      # Same gate as release.sh: every target (tests too), warnings are errors.
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: cargo audit · advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking, the same as release.sh (it was report-only until 1.1.3). An
    # advisory that cannot affect this product is not silenced here: it gets a
    # reasoned entry in .cargo/audit.toml, which is also the way out when a
    # new one lands while something must ship.

    steps:
      - uses: actions/checkout@v4

      # Prebuilt binary rather than `cargo install cargo-audit`, which builds
      # from source and takes minutes for a tool that runs in seconds.
      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit

      # No --deny warnings: `unmaintained` advisories are informational, not
      # exploitable, and reporting them as errors buries the vulnerabilities
      # that matter. A vulnerability fails the job.
      - name: Audit dependencies
        run: cargo audit

      # Surface the result where it is actually read, rather than only in the
      # job log — an advisory nobody opens is the same as no advisory.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Dependency advisories"
            echo
            echo '```'
            cargo audit 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
