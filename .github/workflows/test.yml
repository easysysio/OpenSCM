name: Tests

# Runs on every push and pull request — and is called by the release
# workflow so a tag cannot produce artifacts from a failing tree.
#
# This exists because it didn't: releases were built straight from a tag
# with no test run, and 0.7.4 shipped a template that failed to parse,
# crash-looping the server on boot until it was hotfixed. Every test in
# this suite is fast (the whole run is seconds) — there is no reason for
# it not to gate.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Fewer codegen units / no incremental: CI builds are one-shot.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: cargo test · workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # No toolchain action: rust-toolchain.toml pins the version, and
      # rustup on the runner honours it automatically. Using a setup
      # action here would silently override that pin.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build (workspace)
        run: cargo build --workspace --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

  audit:
    name: cargo audit · advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory-only. A newly published CVE in any of ~500 transitive crates
    # would otherwise appear with no warning and block a release the moment
    # someone needed to ship — so this reports without failing the build.
    # Promote to blocking once the backlog (if any) is cleared.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Prebuilt binary rather than `cargo install cargo-audit`, which builds
      # from source and takes minutes for a tool that runs in seconds.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit --deny warnings || true

      # Surface the result where it is actually read, rather than only in the
      # job log — an advisory nobody opens is the same as no advisory.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Dependency advisories"
            echo
            echo '```'
            cargo audit 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
