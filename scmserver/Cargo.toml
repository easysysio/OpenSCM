[package]
name = "scmserver"
version = "0.11.3"
edition = "2024"
authors = ["Yariv Hakim <yariv@openscm.io>"]
license = "FSL-1.1-ALv2"
description = "Server for Open Security Compliance Manager"


[lib]
name = "scmserver"
path = "src/lib.rs"

[[bin]]
name = "scmserver" 
path = "src/main.rs"


[dependencies]
cfg-if = "1.0"
axum = { version = "0.8.4", features = ["macros", "json", "tokio", "multipart"] }
axum-server = "0.7"
# gzip/brotli response compression (pure-Rust backends, so the cross-compiled
# server targets build without extra system libraries).
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
tokio = { version = "1.34", features = ["full"] }
# SQLite only: the MySQL and Postgres drivers stay disabled. They pulled in
# `rsa`, carrying RUSTSEC-2023-0071 (Marvin timing sidechannel) with no
# upstream fix — for a driver this product never loads. (sqlx-macros is still
# built through sqlx's default features, for SQLite only; the compile-time
# query! macros are unused.)
# "runtime-tokio", not "runtime-tokio-rustls": the TLS half is for connecting
# to a database server over the network, which SQLite never does, and it kept
# webpki-roots 0.26 in the build (RUSTSEC-2026-0381, no fixed 0.26 release).
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tera = "1.20"
include_dir = "0.7"
toml = "0.8.0"
urlencoding = "2.1"
mime_guess = "2.0"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.6"
base64 = "0.21"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bcrypt = "0.17.0"
time = "0.3"
hkdf = "0.12"
sha2 = "0.10"
# rustls-no-provider, not "rustls": the latter selects the aws-lc-rs crypto
# provider, which needs cmake and a C toolchain and does not cross-compile
# to the riscv64 / loongarch64 / s390x / powerpc64 targets this project
# ships. The ring provider is pure Rust plus assembly and builds under
# cargo-zigbuild everywhere. Installed explicitly at startup.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
semver = "1.0"
# ID-token verification for single sign-on. No default features: "use_pem"
# pulls in pem and simple_asn1, and keys arrive as JWKs, not PEM. Verifies on
# ring, the crypto provider already in the build, so nothing else is added —
# in particular not the `rsa` crate (see .cargo/audit.toml).
jsonwebtoken = { version = "9", default-features = false }
# AEAD for secrets stored in the database (secrets.rs). Already in the build
# as rustls's crypto provider; named here so it can be used directly.
ring = "0.17"
regex = "1.10"
ipnet = "2.9"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
printpdf = { version = "0.12", default-features = false, features = ["jpeg", "text_layout"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
# Already in the graph through axum; named here so integration tests can drive
# a Router with tower::ServiceExt::oneshot.
tower = { version = "0.5", features = ["util"] }
