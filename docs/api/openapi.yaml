openapi: 3.1.0
info:
  title: OpenSCM REST API
  version: v1
  summary: Read compliance data, trigger scans and onboard systems from your own tools.
  description: |
    The API of an OpenSCM server (Community Edition or SaaS), at `/api/v1`.

    **Stability.** Frozen from OpenSCM 1.0.0: fields and endpoints may be
    added, but nothing is renamed or removed, or changes type or meaning. A
    breaking change would be `/api/v2`. The deprecated beta, `/api/v1beta1`,
    is described in openapi-v1beta1.yaml until 1.1.0 removes it.

    **Authentication.** Every request sends an API token, created under
    *user menu → API tokens*:

        Authorization: Bearer oscm_api_…

    The browser session cookie is not accepted. A token acts in one
    organization, with its own role (Viewer, Runner, Editor or Admin), at most
    its owner's current role.

    **Errors** are `{"error": {"code": "…", "message": "…"}}` with the HTTP
    status: 400 `invalid_request`, 401 `unauthorized`, 403 `forbidden`,
    404 `not_found` (also for another organization's ids), 409 `conflict`,
    422 `plan_limit`, 429 `rate_limited` (with `Retry-After`),
    503 `not_installed`.

    **Lists** return `{"data": […], "next_cursor": "…" | null, "resume_cursor": "…"}`.
    Pass `cursor=<next_cursor>` for the next page; `limit` is 1–1000 (default
    100). `resume_cursor` marks the last item returned: pass it as `cursor`
    later to get only what was added since.

    **Formats.** Timestamps are ISO 8601 UTC ending in `Z`, in fields whose
    names end in `_at`. Scores are percentages rounded to 2 decimals, and
    `null` when nothing has been scanned.

    **Rate limit:** 600 requests a minute per token.
  license:
    name: AGPL-3.0
servers:
  - url: https://your-openscm-server/api/v1
security:
  - bearer: []

# Layout convention (checked by scmserver/tests/api_spec.rs): each path at two
# spaces of indentation under `paths:`, each method at four.
paths:
  /me:
    get:
      summary: Who this token acts as
      description: The token's owner, organization, effective role and expiry. Any role.
      responses:
        "200": {description: The caller., content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /systems:
    get:
      summary: List systems
      description: Viewer.
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
        - {name: status, in: query, schema: {type: string, enum: [active, pending]}}
        - {name: group, in: query, description: Only systems in this group., schema: {type: integer}}
      responses:
        "200": {description: A page of systems., content: {application/json: {schema: {$ref: "#/components/schemas/SystemPage"}}}}
  /systems/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: Get a system
      description: Viewer.
      responses:
        "200": {description: The system., content: {application/json: {schema: {$ref: "#/components/schemas/System"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Delete a system
      description: Editor. Its results and history go with it.
      responses:
        "204": {description: Deleted.}
        "404": {$ref: "#/components/responses/NotFound"}
  /systems/{id}/approve:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      summary: Approve a pending system
      description: Editor. Already active is not an error. In SaaS, 422 when the plan's system limit is reached.
      responses:
        "200": {description: Active., content: {application/json: {schema: {type: object, properties: {id: {type: integer}, status: {type: string}}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/PlanLimit"}
  /systems/{id}/groups:
    parameters: [{$ref: "#/components/parameters/id"}]
    put:
      summary: Set a system's manual groups
      description: Editor. Replaces its membership of manual groups; automatic groups are rule-driven and cannot be named here (400).
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [groups], properties: {groups: {type: array, items: {type: integer}}}}}}
      responses:
        "200": {description: The manual groups now set., content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /systems/{id}/upgrade:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      summary: Queue an agent upgrade
      description: Admin. The agent upgrades at its next check-in; a failed download is retried hourly. 409 when no newer agent is bundled for the system's platform, or the system is not approved.
      responses:
        "202": {description: Queued., content: {application/json: {schema: {type: object, properties: {id: {type: integer}, upgrade_to: {type: string}}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /systems/{id}/compliance:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: A system's compliance
      description: Viewer. Every policy linked to the system, each test's latest result, evidence and exclusion — the same data as the system report page and a saved system report.
      responses:
        "200": {description: The system report., content: {application/json: {schema: {$ref: "#/components/schemas/SystemCompliance"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /systems/{system_id}/results/{test_id}/exclusion:
    parameters:
      - {name: system_id, in: path, required: true, schema: {type: integer}}
      - {name: test_id, in: path, required: true, schema: {type: integer}}
    put:
      summary: Exclude a finding
      description: Editor. The result stops counting against the system.
      requestBody:
        content: {application/json: {schema: {type: object, properties: {reason: {type: string, maxLength: 500}}}}}
      responses:
        "200": {description: Excluded., content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Restore an excluded finding
      description: Editor.
      responses:
        "204": {description: Restored.}
        "404": {$ref: "#/components/responses/NotFound"}

  /groups:
    get:
      summary: List groups
      description: Viewer.
      parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/cursor"}]
      responses:
        "200": {description: A page of groups., content: {application/json: {schema: {$ref: "#/components/schemas/GroupPage"}}}}
  /groups/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: Get a group, with its systems and linked policies
      description: Viewer.
      responses:
        "200": {description: The group., content: {application/json: {schema: {$ref: "#/components/schemas/Group"}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  /tests:
    get:
      summary: List tests
      description: Viewer.
      parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/cursor"}]
      responses:
        "200": {description: A page of tests., content: {application/json: {schema: {$ref: "#/components/schemas/TestPage"}}}}
  /tests/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: Get a test, with its conditions
      description: Viewer.
      responses:
        "200": {description: The test., content: {application/json: {schema: {$ref: "#/components/schemas/Test"}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  /policies:
    get:
      summary: List policies
      description: Viewer.
      parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/cursor"}]
      responses:
        "200": {description: A page of policies., content: {application/json: {schema: {$ref: "#/components/schemas/PolicyPage"}}}}
  /policies/import:
    post:
      summary: Import a policy
      description: Editor. The body is a policy export (Policies → Export, or the Policy Store's format). Creates the policy (201) or updates the one with the same external id (200). In SaaS, 422 when the plan's policy limit is reached.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [format_version, policy, tests]}}}
      responses:
        "200": {description: Updated., content: {application/json: {schema: {$ref: "#/components/schemas/ImportSummary"}}}}
        "201": {description: Imported., content: {application/json: {schema: {$ref: "#/components/schemas/ImportSummary"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/PlanLimit"}
  /policies/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: Get a policy, with its tests and groups
      description: Viewer.
      responses:
        "200": {description: The policy., content: {application/json: {schema: {$ref: "#/components/schemas/Policy"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /policies/{id}/compliance:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: A policy's compliance
      description: Viewer. Every system in scope and each test's result — the live policy report, as on the policy report page.
      responses:
        "200": {description: The policy report., content: {application/json: {schema: {$ref: "#/components/schemas/PolicyCompliance"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /policies/{id}/run:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      summary: Run a policy now
      description: Runner. Queues the policy's tests on every system in scope; results arrive as agents report. A result is from this run once its checked_at is at or after queued_at.
      responses:
        "202": {description: Queued., content: {application/json: {schema: {$ref: "#/components/schemas/RunQueued"}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  /reports/{kind}:
    parameters: [{$ref: "#/components/parameters/kind"}]
    get:
      summary: List saved reports
      description: Viewer.
      parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/cursor"}]
      responses:
        "200": {description: A page of saved reports., content: {application/json: {schema: {$ref: "#/components/schemas/SavedReportPage"}}}}
    post:
      summary: Save a report now
      description: 'Runner. Body: {"policy_id": N} for a policy report, {"system_id": N} for a system report. In SaaS, 422 when the plan''s report limit is reached.'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {policy_id: {type: integer}, system_id: {type: integer}}}}}
      responses:
        "201": {description: Saved., content: {application/json: {schema: {type: object, properties: {id: {type: integer}, kind: {type: string}}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/PlanLimit"}
  /reports/{kind}/{id}:
    parameters: [{$ref: "#/components/parameters/kind"}, {$ref: "#/components/parameters/id"}]
    get:
      summary: Get a saved report
      description: Viewer. The snapshot as saved. Results carry no checked_at. In policy reports saved before 1.0, system_id and test_id are null: those snapshots kept names only.
      responses:
        "200": {description: The report., content: {application/json: {schema: {$ref: "#/components/schemas/SavedReport"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /reports/{kind}/{id}/pdf:
    parameters: [{$ref: "#/components/parameters/kind"}, {$ref: "#/components/parameters/id"}]
    get:
      summary: Download a saved report as PDF
      description: Viewer. The same PDF as the Download button.
      responses:
        "200": {description: The PDF., content: {application/pdf: {schema: {type: string, format: binary}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  /audit-log:
    get:
      summary: Read the audit log
      description: Admin. Oldest first from the cursor.
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
        - {name: since, in: query, description: "ISO 8601 UTC; entries at or after it.", schema: {type: string, format: date-time}}
        - {name: action, in: query, description: "Actions starting with this, e.g. system. or auth.login_failure.", schema: {type: string}}
      responses:
        "200": {description: A page of entries., content: {application/json: {schema: {$ref: "#/components/schemas/AuditPage"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}

components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, description: "An API token: oscm_api_…"}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: integer}}
    kind: {name: kind, in: path, required: true, schema: {type: string, enum: [policy, system]}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    cursor: {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string}}
  responses:
    BadRequest: {description: Invalid request., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unauthorized: {description: Missing, unknown, expired or revoked token., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: The token's role is too low., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: No such record in this organization., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Conflict: {description: Not possible in the record's current state., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    PlanLimit: {description: The organization's plan has no room (SaaS)., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    Error:
      type: object
      properties:
        error: {type: object, properties: {code: {type: string}, message: {type: string}}}
    Page:
      type: object
      properties:
        data: {type: array, items: {type: object}}
        next_cursor: {type: [string, "null"], description: "The next page's cursor; null on the last page."}
        resume_cursor: {type: string, description: "The cursor after the last item returned, to carry on from later."}
    Me:
      type: object
      properties:
        user: {type: object, properties: {id: {type: integer}, username: {type: string}}}
        organization: {type: string}
        role: {type: string, enum: [viewer, runner, editor, admin]}
        token: {type: object, properties: {name: {type: string}, expires_at: {type: [string, "null"], format: date-time}}}
    System:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        status: {type: string, enum: [active, pending]}
        online: {type: boolean, description: "Checked in within the organization's offline threshold (never checked in: true)."}
        agent:
          type: object
          properties:
            version: {type: string}
            protocol: {type: [integer, "null"], description: "1, or null for agents before agent protocol 1."}
            upgrade_available: {type: [string, "null"], description: "The newer agent version this server offers, if any."}
        os: {type: string}
        arch: {type: string}
        ip: {type: string}
        groups: {type: array, items: {type: object, properties: {id: {type: integer}, name: {type: string}}}}
        compliance:
          type: object
          properties:
            score: {type: [number, "null"], description: "Rounded to 2 decimals; null when not scanned."}
            tests_passed: {type: [integer, "null"]}
            tests_failed: {type: [integer, "null"]}
            tests_total: {type: [integer, "null"]}
        telemetry: {type: object}
        created_at: {type: [string, "null"], format: date-time}
        last_seen_at: {type: [string, "null"], format: date-time}
    SystemPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - {properties: {data: {type: array, items: {$ref: "#/components/schemas/System"}}}}
    ImportSummary:
      type: object
      properties:
        policy_id: {type: integer}
        action: {type: string, enum: [imported, updated]}
        inserted_tests: {type: integer}
        updated_tests: {type: integer}
        unlinked_tests: {type: integer}
    Counts:
      type: object
      properties:
        passed: {type: integer}
        failed: {type: integer}
    Group:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: [string, "null"]}
        automatic: {type: boolean, description: "Members come from a rule, not from PUT /systems/{id}/groups."}
        member_count: {type: integer}
        systems: {type: array, description: "GET /groups/{id} only.", items: {type: object, properties: {id: {type: integer}, name: {type: string}}}}
        policies: {type: array, description: "GET /groups/{id} only.", items: {type: object, properties: {id: {type: integer}, name: {type: string}}}}
    GroupPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - {properties: {data: {type: array, items: {$ref: "#/components/schemas/Group"}}}}
    Test:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: [string, "null"]}
        rationale: {type: [string, "null"]}
        remediation: {type: [string, "null"]}
        severity: {type: string}
        filter: {type: [string, "null"]}
        app_filter: {type: [string, "null"]}
        external_id: {type: [string, "null"]}
        compliance:
          type: object
          properties:
            score: {type: [number, "null"]}
            systems: {$ref: "#/components/schemas/Counts", description: "Systems where the test passes, and fails."}
        conditions: {type: array, description: "GET /tests/{id} only.", items: {type: object}}
        applicability: {type: array, description: "GET /tests/{id} only.", items: {type: object}}
    TestPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - {properties: {data: {type: array, items: {$ref: "#/components/schemas/Test"}}}}
    Policy:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        version: {type: string}
        description: {type: [string, "null"]}
        author: {type: [string, "null"]}
        external_id: {type: [string, "null"]}
        compliance:
          type: object
          properties:
            score: {type: [number, "null"], description: "By scoring_mode; null when not scanned."}
            scoring_mode: {type: string, enum: [test, system], description: "Settings → Compliance."}
            score_by_test: {type: [number, "null"]}
            score_by_system: {type: [number, "null"]}
            score_by_container: {type: [number, "null"]}
            tests: {$ref: "#/components/schemas/Counts", description: "Test results passed and failed."}
            systems: {$ref: "#/components/schemas/Counts", description: "Systems passing every test, and systems with a failure."}
        tests: {type: array, description: "GET /policies/{id} only.", items: {type: object, properties: {id: {type: integer}, name: {type: string}, severity: {type: string}}}}
        groups: {type: array, description: "GET /policies/{id} only.", items: {type: object, properties: {id: {type: integer}, name: {type: string}}}}
    PolicyPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - {properties: {data: {type: array, items: {$ref: "#/components/schemas/Policy"}}}}
    Evidence:
      type: object
      description: One check the agent made.
      properties:
        phase: {type: string, enum: [applicability, condition]}
        element: {type: string}
        input: {type: string}
        selement: {type: string}
        operator: {type: string}
        expected: {type: string}
        result: {type: string}
        note: {type: string}
    Result:
      type: object
      properties:
        test_id: {type: [integer, "null"]}
        test_name: {type: string}
        system_id: {type: [integer, "null"]}
        status: {type: string, enum: [PASS, FAIL, NA, NOT_SCANNED]}
        is_excluded: {type: boolean}
        excluded_reason: {type: [string, "null"]}
        evidence: {type: [array, "null"], items: {$ref: "#/components/schemas/Evidence"}}
        checked_at: {type: [string, "null"], format: date-time, description: "When the server received the result; null when not scanned. Live reports only."}
    Container:
      type: object
      properties:
        container_id: {type: integer}
        name: {type: string}
        runtime: {type: string}
        image: {type: [string, "null"]}
        compliance_score: {type: [number, "null"]}
        pass_count: {type: integer}
        fail_count: {type: integer}
        na_count: {type: integer}
        results: {type: array, items: {$ref: "#/components/schemas/Result"}}
    SystemCompliance:
      type: object
      properties:
        system_id: {type: integer}
        system_name: {type: string}
        os: {type: string}
        arch: {type: string}
        ip: {type: string}
        last_seen_at: {type: [string, "null"], format: date-time, description: "To the second; in a saved system report, to the minute, as saved."}
        generated_at: {type: string, format: date-time, description: "Live report only."}
        compliance_score: {type: [number, "null"]}
        total_pass: {type: integer}
        total_fail: {type: integer}
        total_na: {type: integer}
        policy_groups:
          type: array
          items:
            type: object
            properties:
              policy_id: {type: integer}
              policy_name: {type: string}
              policy_version: {type: string}
              policy_description: {type: [string, "null"]}
              pass_count: {type: integer}
              fail_count: {type: integer}
              na_count: {type: integer}
              excluded_count: {type: integer}
              is_passed: {type: boolean}
              results: {type: array, items: {$ref: "#/components/schemas/Result"}}
        containers: {type: array, items: {$ref: "#/components/schemas/Container"}}
    SystemReport:
      type: object
      description: One system in a policy report.
      properties:
        system_id: {type: [integer, "null"], description: "null in policy reports saved before 1.0."}
        system_name: {type: string}
        pass_count: {type: integer}
        fail_count: {type: integer}
        na_count: {type: integer}
        excluded_count: {type: integer}
        is_passed: {type: boolean}
        results: {type: array, items: {$ref: "#/components/schemas/Result"}}
        containers: {type: array, items: {$ref: "#/components/schemas/Container"}}
    TestMeta:
      type: object
      properties:
        name: {type: string}
        description: {type: [string, "null"], description: "null when empty, as on the test itself."}
        rationale: {type: [string, "null"]}
        remediation: {type: [string, "null"]}
    PolicyCompliance:
      type: object
      properties:
        policy_id: {type: integer}
        policy_name: {type: string}
        version: {type: string}
        description: {type: [string, "null"]}
        generated_at: {type: string, format: date-time}
        compliance_score: {type: [number, "null"]}
        total_pass: {type: integer}
        total_fail: {type: integer}
        total_na: {type: integer}
        total_excluded: {type: integer}
        system_reports: {type: array, items: {$ref: "#/components/schemas/SystemReport"}}
        tests_metadata: {type: array, items: {$ref: "#/components/schemas/TestMeta"}}
    RunQueued:
      type: object
      properties:
        policy_id: {type: integer}
        queued_at: {type: string, format: date-time}
        systems:
          type: array
          description: Active systems in the policy's scope.
          items: {type: object, properties: {id: {type: integer}, name: {type: string}, online: {type: boolean}}}
    SavedReportItem:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [policy, system]}
        saved_at: {type: string, format: date-time}
        saved_by: {type: string}
        policy:
          type: object
          description: Policy reports.
          properties:
            id: {type: [integer, "null"], description: "null for reports saved before 1.0 whose policy could not be told apart by name."}
            name: {type: string}
            version: {type: string}
            description: {type: [string, "null"], description: "GET /reports/policy/{id} only."}
        system:
          type: object
          description: System reports.
          properties:
            id: {type: integer}
            name: {type: string}
    SavedReportPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - {properties: {data: {type: array, items: {$ref: "#/components/schemas/SavedReportItem"}}}}
    SavedReport:
      allOf:
        - {$ref: "#/components/schemas/SavedReportItem"}
        - properties:
            systems: {type: array, description: Policy reports., items: {$ref: "#/components/schemas/SystemReport"}}
            tests: {type: array, description: Policy reports., items: {$ref: "#/components/schemas/TestMeta"}}
            report: {$ref: "#/components/schemas/SystemCompliance", description: "System reports; null if the snapshot cannot be read."}
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        created_at: {type: string, format: date-time}
        action: {type: string}
        actor: {type: object, properties: {id: {type: [integer, "null"]}, username: {type: string}}}
        target: {type: object, properties: {type: {type: [string, "null"]}, id: {type: [string, "null"]}}}
